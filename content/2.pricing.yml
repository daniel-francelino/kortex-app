title: Seu ritmo. Seu espaço. Seu plano.
description: Uma assinatura mensal para organizar suas ideias e sua rotina.
  Comece por você ou encontre espaço para quem faz parte da sua vida.
seo:
  title: Planos mensais | Kortex
  description: Conheça os planos mensais Pessoal, Duo e Família do Kortex. Compare
    recursos e contas incluídas para escolher o seu sistema de organização.
navigation.icon: i-lucide-credit-card
plans:
  - title: Pessoal
    description: Um sistema pessoal para suas ideias, hábitos e próximos passos.
    price:
      month: R$ 19
    stripePriceId:
      month: ""
    button:
      label: Escolher Pessoal
      color: neutral
      variant: subtle
      to: /signup
    features:
      - Notas ilimitadas
      - Tags e coleções
      - Caixa de entrada para capturas
      - Busca rápida
      - Check-in diário
      - Rastreamento básico de hábitos
    billing_period: Cobrança mensal
    billing_cycle: /mês
  - title: Duo
    description: Duas contas independentes, reunidas em uma assinatura.
    price:
      month: R$ 29
    stripePriceId:
      month: ""
    highlight: true
    button:
      label: Escolher Duo
      to: /signup
    features:
      - Tudo do Pessoal
      - 2 contas incluídas
      - Organização independente por pessoa
      - Uso em múltiplos dispositivos
      - Suporte padrão
    billing_period: Cobrança mensal
    billing_cycle: /mês
  - title: Família
    description: Até seis contas para cada pessoa organizar a própria rotina.
    price:
      month: R$ 49
    stripePriceId:
      month: ""
    button:
      label: Escolher Família
      to: /signup
    features:
      - Tudo do Duo
      - Até 6 contas incluídas
      - Espaços e tags por pessoa
      - Suporte prioritário
    billing_period: Cobrança mensal
    billing_cycle: /mês
faq:
  title: Escolha com clareza.
  description: O essencial sobre os planos, em respostas diretas.
  items:
    - label: Como funciona a cobrança?
      content: Todos os planos têm cobrança mensal. O valor exibido é o total da
        assinatura escolhida, não um valor por pessoa.
    - label: Qual é a diferença entre os planos?
      content: O Pessoal é para uso individual. O Duo inclui duas contas
        independentes. O Família inclui até seis contas. Os recursos de cada
        opção estão listados nos cards acima.
    - label: As contas do Duo são independentes?
      content: Sim. Cada pessoa tem sua própria conta e organização. O plano Duo reúne
        duas contas na mesma assinatura.
    - label: Posso usar no celular?
      content: Sim. Você pode acessar o Kortex pelo navegador no celular ou no
        computador. No iPhone, também pode adicioná-lo à Tela de Início.
    - label: Por onde começo?
      content: Crie sua conta e comece por uma nota, tarefa ou hábito. A documentação
        apresenta os primeiros passos para montar seu sistema pessoal.
